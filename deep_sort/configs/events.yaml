EVENTS:
  ENABLED: true

  # Calibrated ground-plane coordinates. The four image points map to the
  # corresponding real-world floor coordinates below.
  COORDINATE_SYSTEM: "ground_plane"
  USE_FOOTPOINT: true

  CALIBRATION:
    IMAGE_POINTS: [[300, 520], [1620, 520], [1900, 1080], [100, 1080]]
    WORLD_POINTS: [[0, 0], [20, 0], [20, 12], [0, 12]]

  # Ticket-machine floor area. This projects to approximately
  # image pixels [(430,650), (700,650), (780,980), (340,980)].
  # Polygon points are floor/world coordinates, not image pixels.
  # COLOR uses OpenCV BGR order: [0, 0, 255] is red.
  ZONES:
    - NAME: "restricted_zone"
      COLOR: [0, 0, 255]
      POLYGON: [[2.47, 3.50], [6.24, 3.50], [7.52, 10.35], [2.38, 10.35]]

  TRAJECTORY_HISTORY_FRAMES: 120
  TRACK_STATE_TTL_FRAMES: 90
  TRAJECTORY_MAX_GAP_FRAMES: 15
  TRAJECTORY_MAX_JUMP_PIXELS_PER_FRAME: 120

  LOITERING:
    ENABLED: true
    MIN_DURATION_SECONDS: 10.0
    MAX_MOVEMENT_UNITS: 1.5
    # Per-frame movement below this value starts the dwell timer. A person
    # continuously walking through the area will not trigger loitering.
    MAX_STEP_MOVEMENT_UNITS: 0.08
    # When true, a person must be inside one of the configured zones.
    REQUIRE_RESTRICTED_ZONE: true
